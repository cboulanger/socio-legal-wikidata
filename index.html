<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directory of Socio-Legal Associations</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div id="app">
    <div id="map" role="region" aria-label="Map of association seats"></div>

      <input type="checkbox" data-role="leadership-toggle"> show current leadership

    <a class="wikidata-badge" href="https://www.wikidata.org/" target="_blank" rel="noopener noreferrer">
      <img src="vendor/wikidata-icon.svg" alt="" width="18" height="18">
      <span>Powered by Wikidata</span>
    </a>
  </div>
  <script src="vendor/d3.min.js"
          integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
