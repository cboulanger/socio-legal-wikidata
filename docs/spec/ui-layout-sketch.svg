    <text x="50" y="218" font-size="10" font-weight="600" fill="#0f172a">Law &amp; Society</text>
    <text x="50" y="234" font-size="8" fill="#64748b">national · Germany</text>
    <text x="50" y="250" font-size="9" fill="#0f172a">seat: Berlin</text>
    <text x="50" y="265" font-size="9" fill="#2563eb">website · institutional email</text>
    <text x="50" y="281" font-size="9" fill="#0f172a">president: E. Kocher</text>
    <text x="50" y="292" font-size="8" fill="#64748b">Europa-Universität Viadrina</text>
    <text x="50" y="308" font-size="9" fill="#0f172a">journal: —</text>
