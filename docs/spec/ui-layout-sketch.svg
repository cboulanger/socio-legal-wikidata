    <text x="612" y="442" font-size="11" fill="#475569">Mobile — read-only</text>
  </g>

  <!-- ============ C · EDIT MODE (opened with ?edit) ============ -->
  <g>
    <rect x="792" y="44" width="368" height="384" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
