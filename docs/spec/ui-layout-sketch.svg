    <text x="978" y="127" font-size="10" fill="#94a3b8"><tspan fill="#2563eb" font-weight="600">1 Identify</tspan><tspan>   2   3</tspan></text>
    <text x="978" y="141" font-size="9" fill="#94a3b8">4   5   6 Review</text>
    <line x1="968" y1="150" x2="1148" y2="150" stroke="#e2e8f0"/>
