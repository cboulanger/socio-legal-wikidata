<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="1180" height="470" fill="#ffffff"/>
  <text x="32" y="26" font-size="14" font-weight="700" fill="#0f172a">Layout sketch — read-only by default; edit mode is opt-in (indicative, not final visual design)</text>

